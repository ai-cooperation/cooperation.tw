- id: ifrs-s2
  name: IFRS S2 永續合規知識庫
  category: knowledge-base
  status: live
  featured: true
  tagline: 188 份文件、逐條可勾稽的永續揭露差距分析系統，涵蓋 IFRS S1/S2、TWSE 氣候揭露與 GHG Protocol
  audience: 永續報告書編製者、合規顧問
  url: https://ifrs-kb.cooperation.tw/
  image: proj-ifrs.jpg
  cta: 進入系統
  problem: 永續報告書要同時符合 IFRS S2、TWSE 附表、GHG Protocol 多套框架，人工逐條比對一份報告書要花數天，還容易漏——漏一條就是合規風險。
  how: 188 份法規與指引文件建成可檢索的知識庫，上傳報告書後系統逐條勾稽：每一條要求標示符合、部分符合或缺漏，附報告書頁碼與條號依據，輸出差距分析與補強優先序。
  tech:
  - 188 份法規與指引文件切成 9,239 個可檢索片段，建向量索引做語意檢索
  - 報告書 PDF 走多引擎 OCR 管線全頁打底，圖表頁另做視覺解析
  - 差距判定對照結構化的揭露要求清單（IFRS S2、TWSE 附表、GHG Protocol 各自獨立計分）
  - 機械驗證閘交叉比對計分與逐條判定，擋掉 AI 湊數字
  - MCP server 介面：AI 助手可直連做差距分析與條文查詢
  solves:
  - 數天的人工比對縮短成一次系統性掃描
  - 每條判定附報告書頁碼與條號，稽核時拿得出依據
  - 缺漏清單附優先序，直接變成報告書改版工作清單
  start: 進入系統，用一份現成的永續報告書跑一次差距分析。
- id: agent-kb
