  - 跨五個市場的動態一站看完，不用逐一追各國媒體
  - 情報有累積——月度 Wiki 和報告庫越用越厚
  - 要寫報告時，AI 助手直接引用庫內文章與出處，不是憑空生成
  start: 進入知識庫瀏覽最新市場動態，或從月度 Wiki 看整體趨勢。
