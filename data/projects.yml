# cooperation.tw 專案總表 — 唯一資料源
# 上新專案：加一筆，跑 python3 _scripts/gen_projects.py，不動版面
# status: live（運行中）/ beta（測試中）/ coming（建置中，佔位不揭露細節）
# featured: true 進首頁精選
# category 固定五類：education / knowledge-base / research / infrastructure / data

categories:
  education:
    name: 教育課程
    mission: 從理解機制開始的 AI 課程，不需要程式背景，但需要理解每一步的邏輯。
  knowledge-base:
    name: 知識庫系統
    mission: 讓領域知識自己被找到——每天自動更新、可追溯來源的知識系統。
  research:
    name: 研究工具
    mission: 把研究流程轉譯成 AI 可以參與的形式，從題目發想到論文投稿。
  infrastructure:
    name: AI 基礎設施
    mission: 支撐所有專案運轉的底層服務，也是課堂上示範的真實系統。
  data:
    name: 資料應用
    mission: 把公開資料變成可以直接使用的工具。

