projects:
- id: ai100
  name: AI 100 講
  category: education
  status: live
  featured: true
  tagline: 十個模組、一百講的 AI 應用課程，把 iPAS AI 應用規劃師的知識體系變成可以每天聽的中文 Podcast
  audience: 準備 iPAS 認證的考生、想系統性補齊 AI 知識的在職者
  url: https://ai-cooperation.github.io/ai100/
  image: proj-ai100.png
  cta: 進入課程
  problem: 想考 iPAS AI 應用規劃師，知識點散落在講義、新聞、名詞解釋之間，沒有一條可以每天推進的路徑。市面上的課程不是太淺就是要你先會寫程式。
  how: 把整個知識體系拆成 10 個模組、每模組 10 講。每一講一個主題、附中文 Podcast——通勤時聽完一講，回家對照教材複習，一百天走完一輪完整體系。
  tech:
  - 靜態課程站部署在 GitHub Pages，內容版本全程 Git 管理
  - 講次內容由 LLM 協作管線起草、人工審校後上線
  - 每講 Podcast 音訊由 TTS 模型批次合成
  solves:
  - 不用自己拼湊教材——考科範圍已拆成一百個可完成的單位
  - 沒有整塊時間也能推進——通勤聽 Podcast 就是進度
  - 零費用開始，不用先賭一筆學費
  start: 打開課程網站，從模組一第一講開始，或直接挑你最弱的模組切入。
