- id: insurance-kb
  name: 保險業知識庫
  category: knowledge-base
  status: live
  featured: true
  tagline: 覆蓋台日韓港與東南亞的保險業情報系統，每天自動收集、翻譯、結構化，累積成可檢索的市場知識
  audience: 保險業從業者、市場研究者
  url: https://insurance-kb.cooperation.tw
  image: proj-kb.png
  cta: 進入知識庫
  problem: 保險業的市場動態散在各國新聞、公告與報告裡，語言不通、來源分散——等你人工整理完，情報已經過期，而且沒有累積，明年還是從零開始。
  how: 每天自動收集多國保險業新聞源，翻譯、去重、正規化後入庫；每月蒸餾成主題 Wiki；VIP 可透過 AI 助手直接對知識庫下研究任務，產出結構化報告。
  tech:
  - 排程爬蟲每日兩次收集台、日、韓、港、東南亞新聞源
  - LLM 管線做翻譯與結構化，公司譯名走 canonical 一致性把關（避免同一家公司多種譯名搜不到）
  - 月度 Wiki 由 LLM 蒸餾、附原文出處連結
  - MCP server 介面：Claude 等 AI 助手可直連查詢、產出雙週報與研究報告
  - 前端部署在 Cloudflare Pages
