- id: paperlab
  name: PaperLab 寫論文找方法
  category: research
  status: live
  featured: true
  tagline: 從模糊想法收斂成研究計畫，再交給自動化 pipeline 跑完實驗與初稿的論文生產系統
  audience: 研究生、需要發表的專業者
  url: https://paperlab.cooperation.tw
  image: proj-paperlab.png
  cta: 進入 PaperLab
  problem: 研究生最常卡在兩個地方：題目收斂不了（想法很多但不知道哪個可做），和流程太長（文獻、實驗、寫作每一段都可能斷掉）。
  how: 引導式對話把模糊想法收斂成結構化的研究契約——題目、研究問題、資料來源、方法逐項確認且資料源當場驗證可得，再交給自動化 pipeline 執行文獻回顧、真實實驗與初稿撰寫。
  tech:
  - 對話端走 MCP server：AI 助手引導題目收斂，資料源當場 probe 驗證可得性
  - 文獻引用經 CrossRef、OpenAlex、Semantic Scholar 三方 API 驗證，杜絕假引用
  - 後端 pipeline 分階段執行：文獻回顧、實驗、統計檢定、稿件撰寫，全程留檔可追溯
  - 稿件以 Quarto 渲染成期刊格式 PDF
  - 機械稽核閘檢查數字溯源與引用覆蓋，不合格擋下重跑
  solves:
  - 題目發想有框架，不再空想——每一步都有選項與建議
  - 資料來源先驗證再開工，不會做到一半發現資料拿不到
  - 初稿的每個數字可追溯到實際跑出的實驗輸出，引用全數驗證過
  start: 進入 PaperLab，從「我想研究」開始一段引導對話。
- id: fluxgate
  name: FluxGate
  category: infrastructure
  status: live
  featured: false
  tagline: 建立在 Cloudflare Workers 上的非同步生圖服務，提交即回、輪詢取件
  audience: 需要輕量生圖 API 的開發者
  url: https://fluxgate.cooperation.tw/
  image: proj-fluxgate.jpg
  cta: 查看服務
  problem: 很多應用只需要「一個能生圖的 API」，但自建要管模型、GPU 與排隊，用大平台又綁一整套 SDK 與帳務。
  how: 輕量生圖閘道：提交需求立刻拿到 job id，幾十秒後輪詢取件。無伺服器架構，沒有維運負擔，站上多個專案的配圖由它供應。
  tech:
  - 整體架構跑在 Cloudflare Workers，無伺服器、零待機成本
  - 生圖模型用 Workers AI 上的 FLUX.1-schnell
  - 非同步 job 機制：提交回 job id，輪詢取件，狀態存 Cloudflare 儲存服務
  - 提供 MCP 工具介面，AI 助手可直接呼叫生圖
  solves:
  - 兩個 API 就能用：提交、取件，不綁 SDK
  - 不用管 GPU、擴容與待機成本
  - 你的 AI 助手可以直接生圖——MCP 介面接上就能用
  start: 打開服務頁，照文件送出第一個生圖請求。
