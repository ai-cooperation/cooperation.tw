# cooperation.tw 專案總表 — 唯一資料源
# 上新專案：加一筆，跑 python3 _scripts/gen_projects.py，不動版面
# status: live（運行中）/ beta（測試中）/ coming（建置中，佔位不揭露細節）
# featured: true 進首頁精選
# category 固定五類：education / knowledge-base / research / infrastructure / data
# 內頁價值敘事四欄：problem（沒有它的痛）/ how（它怎麼解）/ gains（你會得到什麼，列點）/ start（怎麼開始）

categories:
  education:
    name: 教育課程
    mission: 從理解機制開始的 AI 課程，不需要程式背景，但需要理解每一步的邏輯。
  knowledge-base:
    name: 知識庫系統
    mission: 讓領域知識自己被找到——每天自動更新、可追溯來源的知識系統。
  research:
    name: 研究工具
    mission: 把研究流程轉譯成 AI 可以參與的形式，從題目發想到論文投稿。
  infrastructure:
    name: AI 基礎設施
    mission: 支撐所有專案運轉的底層服務，也是課堂上示範的真實系統。
  data:
    name: 資料應用
    mission: 把公開資料變成可以直接使用的工具。

projects:
  - id: ai100
    name: AI 100 講
    category: education
    status: live
    featured: true
    tagline: 十個模組、一百講的 AI 應用課程，把 iPAS AI 應用規劃師的知識體系變成可以每天聽的中文 Podcast
    audience: 準備 iPAS 認證的考生、想系統性補齊 AI 知識的在職者
    url: https://ai-cooperation.github.io/ai100/
    image: proj-ai100.png
    cta: 進入課程
    problem: 想考 iPAS AI 應用規劃師，知識點散落在講義、新聞、名詞解釋之間，沒有一條可以每天推進的路徑。市面上的課程不是太淺就是要你先會寫程式。
    how: 把整個知識體系拆成 10 個模組、每模組 10 講。每一講一個主題、附中文 Podcast——通勤時聽完一講，回家對照教材複習，一百天走完一輪完整體系。
    gains:
      - 完整對應 iPAS AI 應用規劃師的考科範圍，不用自己拼湊教材
      - 每講附中文 Podcast，通勤、運動時間就是學習時間
      - 全部內容免費開放，進度自己掌握
    start: 打開課程網站，從模組一第一講開始，或直接挑你最弱的模組切入。

  - id: sustainability-100
    name: 永續 100 講
    category: education
    status: live
    featured: true
    tagline: 涵蓋淨零碳排、ESG、碳交易十大主題的永續知識系列，AI 驅動的內容生產流程本身就是示範
    audience: 永續從業者、iPAS 淨零碳規劃師考生
    url: https://ai-cooperation.github.io/sustainability-100/
    image: proj-s100.png
    cta: 進入課程
    problem: 永續領域名詞爆炸——淨零、碳中和、ESG、CBAM、SBTi，每個詞背後是一套制度。從業者被要求「懂永續」，卻沒有一套從零到能對話的系統性教材。
    how: 十大主題、一百講，從氣候科學基礎到碳交易實務逐層展開。內容由 AI 驅動的生產流程製作、人工把關——這條流程本身，就是人機協作的實際示範。
    gains:
      - 一套從基礎到實務的完整知識地圖，對應 iPAS 淨零碳規劃師考科
      - 每講聚焦一個概念，可以按需查閱，也可以按順序修完
      - 內容持續更新，跟上制度變動
    start: 從第一講的氣候科學基礎開始，或用主題目錄直接跳到你工作上正在碰的題目。

  - id: aipath
    name: AI 學習路徑
    category: education
    status: live
    featured: false
    tagline: 從零到能動手的 Vibe Coding 三階段路徑，每一階段都以做出真實作品收尾
    audience: 想從使用 AI 進到與 AI 協作開發的學習者
    url: https://aipath.cooperation.tw
    image: proj-aipath.png
    cta: 查看路徑
    problem: 會用 ChatGPT 和「能與 AI 一起把系統做出來」之間有一條斷層。多數教學停在提示詞技巧，學完還是做不出可以上線的東西。
    how: 三個階段的實體工作坊：從對話出作品、到建立自己的工具箱、到能獨立完成一個上線系統。每一階段的驗收標準只有一個——真實作品上線。
    gains:
      - 不需要程式背景，從第一堂課就在做真實的東西
      - 作品上線才算過關，學完手上就有可以展示的成果
      - 課堂用的工具鏈就是站上這些系統實際使用的同一套
    start: 到路徑頁看三階段的說明與最近開課時間，從 Stage 1 開始。

  - id: yolo-vision
    name: YOLO 視覺辨識課
    category: education
    status: live
    featured: false
    tagline: 用真實場景資料訓練自己的物件辨識模型，從標註到部署完整走一遍
    audience: 想進入電腦視覺應用的學習者
    url: https://cooperation.tw/yolo-vision-course/index.html
    image: proj-coming2.png
    cta: 進入課程
    problem: 影像辨識看起來門檻很高——論文、框架、GPU，每一關都能勸退人。但多數實際應用要的不是研究能力，是把一個可用模型訓練出來、部署起來的完整流程。
    how: 用你自己場景的照片當資料，從標註、訓練、驗證到部署，完整走一遍 YOLO 的實作流程。每一步都講清楚為什麼這樣做，不是照著按。
    gains:
      - 課程結束時你有一個用自己資料訓練出來的可用模型
      - 理解資料品質、標註策略對辨識效果的實際影響
      - 部署環節直接對接真實使用場景
    start: 進入課程頁看章節安排，準備一批你想辨識的場景照片。

  - id: wellap
    name: WELL AP 學習站
    category: education
    status: live
    featured: false
    tagline: 考古題解析、題庫練習、講義整合的 WELL AP 認證學習系統
    audience: WELL AP 認證考生
    url: https://wellap.cooperation.tw/index.html
    image: proj-coming2.png
    cta: 進入學習站
    problem: WELL AP 是健康建築領域的國際認證，但中文備考資源極少——考生面對英文題庫和厚重概念手冊，不知道從哪裡下手、考點在哪裡。
    how: 把考古題逐題解析、按概念分類成題庫，配合整理過的中文講義。先讀講義建立概念，再用題庫驗證，錯題回頭對應講義段落。
    gains:
      - 中文解析的考古題庫，逐題附考點說明
      - 講義與題目互相對應，弱點看得見
      - 線上系統隨時可練，進度保留
    start: 登入學習站，先做一輪診斷測驗看自己的起點。

  - id: kb
    name: 知識學習系統
    category: knowledge-base
    status: live
    featured: true
    tagline: 給專業從業者與證照考生的領域知識庫入口，保險業、醫學等領域每天自動累積
    audience: 專業從業者、證照考生
    url: https://kb.cooperation.tw
    image: proj-kb.png
    cta: 進入系統
    problem: 專業領域的知識散落在新聞、報告、公告裡，從業者每天被資訊追著跑，卻沒有一個地方能把這些累積成可以查、可以信的知識。
    how: 每個領域一套自動化管線：爬蟲每天收集來源、AI 整理成結構化條目、每月蒸餾成主題 Wiki。所有內容可追溯到原始出處，不是 AI 憑空生成。
    gains:
      - 領域知識每天自動累積，不用自己追新聞
      - 條目附原始來源連結，查證有據
      - 已上線保險業、醫學領域，持續擴充中
    start: 從入口頁選你的領域，保險業知識庫已開放瀏覽。

  - id: ifrs-s2
    name: IFRS S2 永續合規知識庫
    category: knowledge-base
    status: live
    featured: true
    tagline: 188 份文件、逐條可勾稽的永續揭露差距分析系統，涵蓋 IFRS S1/S2、TWSE 氣候揭露與 GHG Protocol
    audience: 永續報告書編製者、合規顧問
    url: https://ifrs-kb.cooperation.tw/
    image: proj-coming1.png
    cta: 進入系統
    problem: 永續報告書要同時符合 IFRS S2、TWSE 附表、GHG Protocol 多套框架，人工逐條比對一份報告書要花數天，還容易漏——漏一條就是合規風險。
    how: 188 份法規與指引文件建成可檢索的知識庫，上傳報告書後系統逐條勾稽：每一條要求標示符合、部分符合或缺漏，附報告書頁碼與條號依據，輸出差距分析與補強優先序。
    gains:
      - 數天的人工比對縮短成一次系統性掃描
      - 每條判定都有出處，稽核等級的可追溯性
      - 缺漏清單直接變成報告書改版工作清單
    start: 進入系統，用一份現成的永續報告書跑一次差距分析。

  - id: agent-kb
    name: Agent KB 教學知識庫
    category: knowledge-base
    status: live
    featured: false
    tagline: 課堂案例、概念字典、可重用工作流的教學知識庫，學員上課用的同一套系統
    audience: Vibe Coding 課程學員
    url: https://agent-kb.cooperation.tw
    image: proj-agent-kb.png
    cta: 進入知識庫
    problem: 上完課回家，講過的案例、名詞、工作流散在筆記和記憶裡，要用的時候找不回來——課程的價值隨時間流失。
    how: 把課堂內容結構化成四類：真實開發案例（含踩坑過程）、概念字典、可重用工作流、行為準則。學員隨時可查，也能建立自己的私人筆記區。
    gains:
      - 課堂案例含完整踩坑脈絡，不是只有結論
      - 概念查詢即開即用，複習成本降到最低
      - 私人筆記與公開教材分開，累積自己的知識庫
    start: 用課程發的帳號登入，從案例庫開始逛。

  - id: paperlab
    name: PaperLab 寫論文找方法
    category: research
    status: live
    featured: true
    tagline: 從模糊想法收斂成研究計畫，再交給自動化 pipeline 跑完實驗與初稿的論文生產系統
    audience: 研究生、需要發表的專業者
    url: https://paperlab.cooperation.tw
    image: proj-paperlab.png
    cta: 進入 PaperLab
    problem: 研究生最常卡在兩個地方：題目收斂不了（想法很多但不知道哪個可做），和流程太長（文獻、實驗、寫作每一段都可能斷掉）。
    how: 引導式對話把模糊想法收斂成結構化的研究契約——題目、研究問題、資料來源、方法逐項確認且資料源當場驗證可得，再交給自動化 pipeline 執行文獻回顧、真實實驗與初稿撰寫。
    gains:
      - 題目發想有框架，不再空想——每一步都有選項與建議
      - 資料來源先驗證再開工，避免做到一半發現資料拿不到
      - 產出的初稿附完整實驗紀錄，數字可追溯
    start: 進入 PaperLab，從「我想研究」開始一段引導對話。

  - id: gemgate
    name: GemGate
    category: infrastructure
    status: live
    featured: false
    tagline: 統一入口的多模態 AI 閘道——生圖、影片、語音、網頁擷取，一組 API 全部接通
    audience: 需要多模態 AI 能力的開發者
    url: http://43.159.131.124:8760/
    image: proj-gemgate.png
    cta: 查看服務
    problem: 生圖、影片、語音各家服務的 API 格式、認證、額度規則都不同，每接一個服務就是一次重工，維護成本隨服務數量疊加。
    how: 一個閘道統一所有多模態能力：同一組 API 格式呼叫生圖、影片、Podcast、語音合成與網頁擷取，閘道內部處理路由、額度與重試。
    gains:
      - 接一次，拿到全部多模態能力
      - 非同步任務統一用 job 機制輪詢，不用管各家差異
      - 站上多個專案的配圖與音訊都由它供應——它本身就在生產環境跑
    start: 查看服務頁的 API 文件，用一個生圖請求試手。

  - id: fluxgate
    name: FluxGate
    category: infrastructure
    status: live
    featured: false
    tagline: 建立在 Cloudflare Workers 上的非同步生圖服務，提交即回、輪詢取件
    audience: 需要輕量生圖 API 的開發者
    url: https://fluxgate.cooperation.tw/
    image: proj-gemgate.png
    cta: 查看服務
    problem: 很多應用只需要「一個能生圖的 API」，但自建要管模型、GPU 與排隊，用大平台又綁一整套 SDK 與帳務。
    how: 架在 Cloudflare Workers 上的輕量生圖閘道：提交需求立刻拿到 job id，幾十秒後輪詢取件。無伺服器架構，沒有維運負擔。
    gains:
      - 兩個 API 就能用：提交、取件
      - 無伺服器，不用管擴容與待機成本
      - 適合教學與原型——課堂上示範的就是這一套
    start: 打開服務頁，照文件送出第一個生圖請求。

  - id: classclaw
    name: ClassClaw
    category: infrastructure
    status: live
    featured: false
    tagline: 一支 QR code 就能開始的課堂即時互動系統，即將開源
    audience: 需要課堂互動工具的講師
    url: https://ai100.cooperation.tw/classroom/host
    image: proj-gemgate.png
    cta: 查看系統
    problem: 課堂互動工具不是要學員裝 App、註冊帳號，就是免費版處處受限——互動的門檻比互動本身還高。
    how: 講師開一個房間，學員掃 QR code 即入，投票、搶答、意見牆即時同步。不用安裝、不用註冊，用完即散。
    gains:
      - 學員進場只要掃碼，三秒開始互動
      - 講師端即時看到全場回應分布
      - 即將開源——可以自己部署、自己改
    start: 打開主持端建一個房間，用手機掃碼體驗學員視角。

  - id: foreclosure-map
    name: 法拍物件地圖
    category: data
    status: live
    featured: false
    tagline: 整合全台 22 間法院公告的法拍屋即時地圖，公開資料變成可以直接用的查詢工具
    audience: 不動產從業者、投資研究者
    url: https://ai-cooperation.github.io/foreclosure-map/
    image: proj-foreclosure.png
    cta: 開啟地圖
    problem: 法拍公告分散在全台 22 間法院各自的系統，格式不一、沒有地圖、不能篩選——研究一個區域的法拍物件要人工翻遍各法院網站。
    how: 自動化爬蟲定期收集各法院公告，統一格式後上地圖。按區域、價格帶、拍次直接篩，點物件看完整公告內容。
    gains:
      - 全台法拍物件一張地圖看完，不用逐一翻法院網站
      - 地理位置與周邊環境一目瞭然
      - 資料定期自動更新
    start: 開啟地圖，縮放到你關注的區域。

  - id: sustainability-platform
    name: 永續決策平台
    category: data
    status: live
    featured: false
    tagline: 把永續數據整理成可以支撐決策的視覺化平台
    audience: 永續決策者
    url: https://ai-cooperation.github.io/ai-sustainability-platform/
    image: proj-sustainability.png
    cta: 進入平台
    problem: 永續決策需要數據支撐，但數據散在各部會與國際組織的報告裡，等人工整理完，決策時點已經過了。
    how: 把公開的永續數據源整合成視覺化儀表板，決策相關的指標放在同一個畫面上對照。
    gains:
      - 關鍵永續指標一站瀏覽
      - 視覺化呈現，會議上直接可用
      - 資料來源公開可查
    start: 進入平台，從你關注的指標主題開始。

