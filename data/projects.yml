  - 學完手上有上線作品，不是一疊筆記
  - 課堂用的工具鏈就是業界實際在用的那一套
  start: 到路徑頁看三階段的說明與最近開課時間，從 Stage 1 開始。
- id: yolo-vision
  name: YOLO 視覺辨識課
  category: education
  status: live
  featured: false
  tagline: 用真實場景資料訓練自己的物件辨識模型，從標註到部署完整走一遍
  audience: 想進入電腦視覺應用的學習者
  url: https://cooperation.tw/yolo-vision-course/index.html
  image: proj-yolo.jpg
  cta: 進入課程
  problem: 影像辨識看起來門檻很高——論文、框架、GPU，每一關都能勸退人。但多數實際應用要的不是研究能力，是把一個可用模型訓練出來、部署起來的完整流程。
  how: 用你自己場景的照片當資料，從標註、訓練、驗證到部署，完整走一遍物件辨識的實作流程。每一步都講清楚為什麼這樣做，不是照著按。
  tech:
  - 以 Ultralytics YOLO 系列模型為主軸
  - 訓練全程使用免費 GPU 資源（Google Colab 等），不需要自備顯卡
  - 範例採用公開免費資料集，零成本就能完整走一遍
  - 涵蓋資料標註工具、訓練環境設定、模型匯出與部署
  - 課程教材開放在課程站，範例資料集可直接下載
  solves:
  - 課程結束時你有一個用自己資料訓練出來的可用模型
  - 看得懂資料品質與標註策略對辨識效果的實際影響
  - 部署環節直接對接真實使用場景，不是停在 notebook
  start: 進入課程頁看章節安排，準備一批你想辨識的場景照片。
- id: wellap
