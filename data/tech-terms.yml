# 能力軸 × 代表術語（/method/ 四軸區塊的「背後技術」小字）
axes:
- {id: A, name: 看懂文件與影像, terms: [多模態理解, OCR 管線, 視覺解析]}
- {id: B, name: 把資料變成系統, terms: [GAS, 結構化資料, Web App, 表單觸發器]}
- {id: C, name: 建自己的知識庫, terms: [RAG, Embedding, 向量檢索, Provenance, MCP]}
- {id: D, name: 讓 AI 自動運轉, terms: [Agent, 排程爬蟲, GitHub Actions, Cloudflare Workers, 機械驗證閘]}

# 盤點時發現的缺口（上線前決定）
gaps:
- Gem、GAS、GitHub Pages、IDE 在 Agent KB 沒有獨立字典條目，chip 先連對應模組頁
- 概念字典另有 9 條未排入 chip（agents-md/claude-code/cursor/function-calling/oauth/rule/tasks/token/worktree/mhs），過深或工具綁定，保留在字典不上官網
- 老師 skills 庫 94+ 個：不逐一上官網，/method/ 以一句話帶過＋連 Agent KB
