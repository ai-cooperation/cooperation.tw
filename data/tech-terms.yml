  - {label: 脈絡工程（Context Engineering）, link: "wiki:context-engineering"}
  - {label: 外殼工程（Harness）, link: "wiki:harness-engineering"}
  - {label: 記憶系統（Memory）, link: "wiki:memory"}
  - {label: 事件擴充（Hooks）, link: "wiki:hooks"}
  - {label: 代理人互通（A2A）, link: "wiki:a2a"}
  - {label: 知識可追溯性（Provenance）, link: "wiki:provenance"}
