# 九大情境課程資料源（唯一真相源）
# 來源：knowledge-base business/marketing/2026-11-15-九大情境課程市場與官網升級企劃.md v1.0
# 原則：賣場景不賣工具、賣成果不賣課綱；狀態誠實分流（pilot=預約試上 / planned=無標籤），
# 規劃中的課程結構上不出現報名 CTA，只收興趣登記。
# 產出：python3 _scripts/gen_courses.py → courses/*.qmd

categories:
  life:
    name: 生活與家庭
    hook: 照顧家人、毛孩與自己的家，AI 可以多幫一點
  work:
    name: 工作與產業
    hook: 重複的流程、看不完的資料，做一個自己的小系統
  learn:
    name: 教育與研究
    hook: 讓學習真的發生、讓研究想法變成可執行的計畫

courses:
- id: no-code-system
  axes: [B, D]
  projects: [agent-kb, aipath]
  name: 不會寫程式，也能打造自己的小系統
  category: work
  status: pilot
  wave: 1
  tagline: 每天重複整理訂單與表單，只想做個小系統，為什麼需要找工程師
  take: 可實際下單的訂購網頁與後台
  audience: 中小企業主、行政與專案工作者
  story: 拿「辦公室訂飲料」當實戰題：從需求拆解開始，做出同事用手機就能下單的訂購網頁、自動彙整的訂單表——全程不寫程式，但每一步都知道自己在做什麼。
  skills:
  - Prompt 四要素與需求拆解
  - 把常用指令包成可重複使用的 AI 小幫手，由 AI 產生表單、網頁與自動彙整流程
  - 錯誤修正、功能驗收與安全部署
  deliverables:
  - 可實際下單的訂購網頁
  - 後台訂單資料表
  - 功能驗收清單
  abilities: 問題定義、流程設計、資料模型、非工程師的 AI 協作開發、品質驗收
  future_roles: 數位工作改善種子人才、輕量系統規劃者、AI 協作開發帶領人
  assets: 既有課程知識庫（Agent KB），以及課堂實際使用的飲料訂購系統案例
  limits: 課程聚焦輕量工作系統；正式營運系統的資安與維運需另行評估。
  faq:
  - q: 完全不會寫程式可以參加嗎？
    a: 可以。課程設計給沒有程式背景的人，從需求拆解開始，由 AI 產生程式，你負責定義問題與驗收成果。
  - q: 學完可以做出什麼？
    a: 一個同事可以用手機操作的訂購網頁，加上自動彙整的後台資料表，以及一份你自己驗收過的功能清單。
  seo_title: 不會寫程式也能做自己的小系統｜AI 實作課程
  seo_description: 給中小企業主與行政工作者的 AI 實作課：不寫程式，用 AI 做出可實測的訂購網頁與後台資料表，學會需求拆解與功能驗收。
  image: course-no-code-system.png

- id: aiot-button
  axes: [B, D]
  name: AIoT 入門，從一顆門鈴按鍵開始
  category: life
  status: pilot
  wave: 1
  tagline: 想讓家裡聰明一點，一看到電路板和程式就想放棄
  take: 按一下就通知 AI 助手的智慧門鈴按鍵
  audience: 想入門智慧家庭的生活玩家、想評估感測應用的工作者
  story: 從一顆實體按鍵開始：按下門鈴，訊號先到你的 AI 助手，由它照你定的規則通知家人、記下到訪紀錄——一堂課走完「實體訊號到 AI 行動」的完整路徑。
  skills:
  - 把實體按鍵連上網路的現成模組（課堂提供，不用焊接）
  - 按鍵事件傳給 AI 助手（Agent）的串接方法
  - 用白話規則決定 AI 助手收到訊號後做什麼：通知、記錄、回覆
  deliverables:
  - 按下去就通知 AI 助手、由它轉知家人的門鈴按鍵
  - AI 助手自動整理的到訪紀錄表
  - 一份自己改得動的自動化規則
  abilities: 感測訊號理解、事件流程設計、自動化規則撰寫、裝置與 AI 的串接思維
  future_roles: 智慧家庭應用玩家、AIoT 導入種子人才；進階可銜接企業用電異常偵探實戰班，把同一套訊號到行動的思維，用在工廠與辦公室的用電資料上
  assets: 課堂使用的按鍵模組與通知流程，來自實際部署中的感測專案經驗
  limits: 單堂課完成的是一顆按鍵到通知的最小流程，不含整屋智慧家庭佈建；長期穩定運行需要家中電源與網路環境配合。
  faq:
  - q: 需要自己買設備嗎？
    a: 不需要。課堂提供練習用的按鍵模組；想帶回家延伸使用，課堂會說明選購方式，屬於入門等級的零件。
  - q: 完全不懂電子和程式可以參加嗎？
    a: 可以。模組是現成的，不用焊接也不用寫程式。你的工作是定義規則：按下按鍵之後，AI 助手要通知誰、記錄什麼。
  - q: 跟企業用電異常偵探實戰班什麼關係？
    a: 這門是入口課，練的是實體訊號到 AI 行動的基本功；偵探實戰班把同一套思維放大到企業的用電資料與異常偵測，適合上完這門再走。
  seo_title: AIoT 入門課程：一顆門鈴按鍵連動 AI 助手｜不用寫程式
  seo_description: 給智慧家庭入門者的 AIoT 實作課：用現成模組把實體門鈴按鍵接上你的 AI 助手，按一下就通知家人、自動記錄到訪，不用焊接不用寫程式。
  image: course-aiot-button.png

- id: remote-care
  axes: [C, D]
  name: 遠距安心照護實作營
  category: life
  status: pilot
  wave: 3
  tagline: 家人獨自在家，不想一直盯著鏡頭，怎樣多一層安心
  take: 異常提醒流程與模擬通知展示
  audience: 家庭照顧者、長照工作者
  story: 你設計一條「活動事件、異常規則、家屬通知、人工確認」的照護流程，用模擬資料展示：長輩夜間離床太久、白天長時間沒有活動，系統怎麼提醒家人。
  skills:
  - 照護需求訪談 Prompt
  - 熱成像、門磁、壓力墊等感測訊號的理解，與 AI 事件分類
  - 小型感測裝置與手機通知的串接（課堂提供現成模組，不用自己焊電路）
  deliverables:
  - 感測器選型表
  - 事件處理流程圖
  - 模擬通知展示
  abilities: 場域訪談、感測系統規劃、風險管理、事件判讀、隱私設計
  future_roles: 智慧照護應用帶領人、長照科技導入協作者
  assets: 低解析度熱成像、夜間離床偵測等進行中的照護專案
  limits: 感測只能提示可能的變化，不能判斷吃飯喝水、醫療狀況或保證人身安全，不能取代人工照護與緊急應變。
  faq:
  - q: 這會用攝影機監看長輩嗎？
    a: 不會。課程採用熱成像、門磁、壓力墊等低隱私侵入感測，重點是事件提示與人工確認，不是影像監控。
  - q: 系統可以保證長輩安全嗎？
    a: 不能。感測與 AI 只能多一層提示，不能取代人工照護與緊急應變，課程會清楚教你劃分系統能做與不能做的界線。
  seo_title: 遠距照護實作課：長輩獨居的安心提醒系統｜非攝影機方案
  seo_description: 給家庭照顧者的智慧照護課程：用熱成像與門磁等低隱私感測，設計長輩活動異常提醒流程，不靠攝影機監看。
  image: course-remote-care.png

- id: pet-health
  axes: [A, B]
  name: 毛孩健康觀察與智慧照護工作坊
  category: life
  status: pilot
  wave: 1
  tagline: 毛孩不會說話，最近好像吃得少了，是真的有變化嗎
  take: 可長期追蹤的寵物健康檔案
  audience: 寵物飼主、寵物服務業
  story: 把食品標籤、健檢報告、每天的飲食與活動紀錄，整合成一份可以長期追蹤的寵物檔案——下次回診，拿得出三個月的趨勢，而不只是憑印象。
  skills:
  - 圖片與文件理解、資料擷取與結構化
  - 獸醫知識來源檢索
  - 觀察欄位設計與長期趨勢摘要
  deliverables:
  - 寵物健康紀錄檔案
  - 食品與健檢資料整理
  - 日常觀察清單
  abilities: 健康資料素養、日常變化追蹤、資訊核對、與獸醫溝通
  future_roles: 寵物紀錄推廣者、寵物服務數位應用人員
  assets: 自建的寵物飲食與健檢紀錄系統，與血檢、食品標籤示範資料
  limits: AI 不能診斷或開立治療建議；課程初版不依賴攝影機自動偵測。
  faq:
  - q: AI 可以幫我的寵物看病嗎？
    a: 不能。課程教你建立可追蹤的健康紀錄與觀察清單，讓你跟獸醫溝通時拿得出具體資料，診斷永遠交給獸醫。
  - q: 需要買特別的設備嗎？
    a: 不需要。初版課程用手機拍照與日常紀錄就能完成，不依賴攝影機或穿戴裝置。
  seo_title: 寵物健康紀錄實作坊：用 AI 整理毛孩飲食與健檢資料
  seo_description: 給飼主的寵物健康觀察課程：用 AI 整理食品標籤、健檢報告與日常紀錄，建立可長期追蹤的毛孩健康檔案。
  image: course-pet-health.png

- id: learning-coach
  axes: [C]
  projects: [agent-kb, ai100, wellap]
  name: AI 檢索式學習教練培育班
  category: learn
  status: pilot
  wave: 1
  tagline: 學生看起來都懂，考試卻答不出來，怎樣幫他真正學會
  take: 互動練習教案與評分規準
  audience: 教師、講師、企業訓練人員
  story: 把你最熟悉的一份教材做成「診斷、回想、回饋、重試」的互動練習，並完成一次同儕試教——學生被要求回想與重試，而不是再看一次教材。
  skills:
  - 教學型 Prompt 與蘇格拉底提問
  - 題目與評分規準設計、Retrieval Practice
  - 學習資料分析與教材知識檢索
  deliverables:
  - 互動練習教案
  - 評分規準
  - 試教觀察表
  abilities: 教學診斷、形成性評量、提問設計、回饋與教學成效檢核
  future_roles: AI 學習教練、企業內訓師、檢索式學習種子教師
  assets: 自建的互動學習系統，以及 iPAS、英文學習的實際範例
  limits: 師資資格須另有實務與試教評量制度，單堂課不保證任何資格。
  faq:
  - q: 什麼是檢索式學習？
    a: 讓學習者主動回想而不是重複閱讀的學習法，研究證實比重讀教材有效。課程教你把教材轉成診斷、回想、回饋、重試的練習循環。
  - q: 上完課就是認證的學習教練嗎？
    a: 不是。課程提供方法與試教練習，正式的帶領者或講師資格需要另外通過實務試教與評量。
  seo_title: AI 檢索式學習教練培育班：把教材變成互動練習
  seo_description: 給教師與企業內訓人員的課程：用 AI 把教材做成診斷回想回饋重試的互動練習，學會提問設計與教學成效檢核。
  image: course-learning-coach.png

- id: energy-detective
  axes: [A, B]
  name: 企業用電異常偵探實戰班
  category: work
  status: pilot
  wave: 2
  tagline: 工廠電費增加了，設備看似正常，從哪個時段哪台設備開始查
  take: 異常假設矩陣與現場查證清單
  audience: 廠務、能源管理人員、ESCO
  story: 判讀去識別化的真實工廠負載曲線，提出異常原因假設，再設計現場查證方式——一步步建立可驗證的推論，支撐節能診斷。
  skills:
  - 時序資料整理、時戳與單位查核
  - 負載基準線與離群值分析
  - 從總用電拆解設備行為的概念與限制（非侵入式負載監測 NILM）、AI 輔助報告
  deliverables:
  - 負載圖表
  - 異常假設矩陣
  - 現場查證清單
  abilities: 量測有效性判斷、證據推論、節能診斷規劃、成本效益溝通
  future_roles: 能源數據人才、ESCO 專案協作者、節能應用顧問
  assets: 工業電力與 NILM 多年研究成果
  limits: 不能憑負載曲線直接診斷設備故障，也不保證節能效益。
  faq:
  - q: 需要先懂電力專業嗎？
    a: 需要基本的廠務或能源管理背景。課程聚焦在資料判讀與假設驗證方法，不要求電機專業學位。
  - q: 學完就能幫工廠省電嗎？
    a: 課程教你找出值得查證的異常時段與設備假設，實際節能效益取決於現場驗證結果，課程不做節能保證。
  seo_title: 企業用電異常分析實戰班：從負載曲線找出異常用電
  seo_description: 給廠務與能源管理人員的實戰課程：判讀負載曲線、建立異常假設矩陣與現場查證清單，用資料支撐節能診斷。
  image: course-energy-detective.png

- id: meeting-follow
  axes: [B, D]
  name: 開完會，事情真的有在往前走嗎
  category: work
  status: pilot
  wave: 2
  tagline: 上週開會明明有結論，這週卻沒人追蹤——缺的不是逐字稿，是會後的追蹤機制
  take: 可稽核的決議紀錄與待辦追蹤表
  audience: 主管、行政、PMO
  story: 用模擬會議音檔實際走一遍：整理出決議、負責人與期限，建立追蹤表，並在下次會議前自動產出進度摘要——每個結論都查得到出處、追得到進度。
  skills:
  - 語音轉文字與專有名詞校正
  - 區分討論、決議與待辦的摘要 Prompt
  - 追蹤表自動化與來源回查
  deliverables:
  - 可稽核的決議紀錄
  - 待辦追蹤表
  - 下次會議進度摘要
  abilities: 會議引導、責任拆解、專案追蹤、紀錄查核
  future_roles: 專案協作帶領人、PMO、工作改善種子人才
  assets: 自建的會議記錄追蹤系統，與一套完整的模擬企業資料
  limits: 錄音應取得與會者同意；AI 不可自行把討論認定為已決議，決議確認權在人。
  faq:
  - q: 跟逐字稿工具有什麼不同？
    a: 逐字稿只是記錄。課程教你建立從決議、負責人、期限到下次會議回顧的完整追蹤流程，重點是追蹤而不是記錄。
  - q: AI 會不會把還在討論的事當成決議？
    a: 課程明確教你設計人工確認關卡：AI 負責整理候選決議，確認權永遠在與會的人身上。
  seo_title: 會議決議追蹤實作課：讓開會結論真的被執行
  seo_description: 給主管與 PMO 的課程：用 AI 把會議音檔整理成可稽核的決議紀錄與待辦追蹤表，讓每個決議都被追蹤到落地。
  image: course-meeting-follow.png

- id: home-preview
  axes: [A]
  projects: [fluxgate]
  name: 我的家，裝修前先看見
  category: life
  status: pilot
  wave: 3
  tagline: 想改造客廳，看了很多照片，卻不知道這些風格用在自己家會怎樣
  take: 自己家的多風格模擬圖與方案比較
  audience: 屋主、設計助理、房仲
  story: 用自己空間的照片與需求條件，生成不同風格的改造方案並排比較——跟設計師溝通時，拿的是「我家的樣子」，而不是別人家的參考圖。
  skills:
  - 需求訪談 Prompt 與視覺提示
  - 影像編輯、遮罩與參考影像概念
  - 多版本評估與設計提案簡報
  deliverables:
  - 空間需求書
  - 多風格模擬圖
  - 方案比較簡報
  abilities: 需求表達、視覺化溝通、設計方案選擇、提案能力
  future_roles: 空間提案協作人、設計助理、房仲展示應用人員
  assets: 自建的空間風格生成系統——站上實際運行的圖像生成服務就是它的引擎
  limits: 模擬圖不等於精確尺寸、估價或可施工設計；正式裝修仍需專業設計師與工程評估。
  faq:
  - q: 生成的圖可以直接拿去施工嗎？
    a: 不行。模擬圖是風格溝通工具，不含精確尺寸與工法；課程教你用它跟設計師有效溝通，不是取代設計師。
  - q: 需要會修圖軟體嗎？
    a: 不需要。課程用 AI 工具完成風格生成與比較，你負責的是表達需求與評估方案。
