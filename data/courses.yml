- id: card-assistant
  axes: [A, C]
  projects: [smallgreen-cloud]
  name: 換了一疊名片，然後呢
  category: work
  status: pilot
  wave: 3
  tagline: 展會跑完、聚會結束，名片疊在抽屜——想找上個月那位廠商，只記得他做模具
  take: 部署在自己帳號的名片庫：拍照 AI 建檔、名片牆網頁、AI 自然語言查人
  audience: 業務、顧問、接案者、常跑展會與交流活動的人
  story: 拿起手機一次拍下整桌名片，AI 自動分成一人一筆建檔，欄位不清楚的還會上網查證後校正——實測一次六張、六個人、六筆資料。名片庫部署在你自己的雲端帳號：打開名片牆網頁看全部，或直接問 AI「上次那位做模具的廠商是誰」，連人帶脈絡找出來。
  skills:
  - 名片照片轉結構化資料：AI 看圖、分人、自動查證校正
  - 照服務卡把開源名片庫部署到自己的帳號
  - MCP 接上 ChatGPT／Claude，用自然語言查自己的名片庫
  deliverables:
  - 部署在自己帳號的名片庫與名片牆網頁
  - 接上 AI 助手的名片查詢（MCP）
  - 一套「拍了就建檔、建了就找得到」的聯絡紀錄流程
  abilities: 影像轉資料思維、資料主權意識、自然語言檢索、小服務部署
  future_roles: 業務流程數位化種子、個人 CRM 實踐者、部門小工具導入者
  assets: 站上公開運行的名片 MCP——開源專案，demo 可直接點，課堂部署的就是同一套
  limits: 這是個人名片庫，不是團隊 CRM；AI 辨識與查證結果仍需本人確認；名片屬個資，課堂用虛構名片練習，你自己的名片庫只存在你自己的帳號。
  faq:
  - q: 跟名片掃描 App 差在哪？
    a: 訂閱制 App 把你的人脈資料存在廠商雲端、按月收費；這門課的名片庫部署在你自己的帳號，免費額度內運行，資料與刪除權都在你手上。
  - q: 一次拍很多張可以嗎？
    a: 可以。實測一次拍六張不同人的名片，AI 會自動分成六筆建檔；資訊不清楚的欄位會上網查證後校正，你只需要最後確認。
  - q: 不會寫程式能上嗎？
    a: 可以。部署照服務卡與 AI 導遊一步步走，課程重點是建檔與查詢的工作流程，不是寫程式。
  seo_title: 名片管理實作課：拍照建檔、AI 查詢，名片庫在自己帳號
  seo_description: 給業務與顧問的課程：手機拍名片 AI 自動分人建檔與查證校正，部署在自己雲端帳號的名片庫與 MCP 查詢，沒有月費、資料主權在自己。
  image: course-card-assistant.png
