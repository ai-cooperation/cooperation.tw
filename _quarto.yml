project:
  type: website
  output-dir: _site
  post-render: python3 _scripts/inject_canonical.py
  resources:
    - assets/images/**
    - assets/videos/**
    - assets/scenario-video.js
    - assets/card-fx.js
    - assets/card-fx.css
    - assets/share.js
    - assets/icon-*.png
    - assets/icon.svg
    - assets/apple-touch-icon.png
    - assets/favicon.png
    - assets/og-image.png
    - llms.txt
    - robots.txt
    - manifest.json
    - CNAME

website:
  title: "AI Cooperation"
  description: "打造人機協作的基礎架構"
  site-url: https://cooperation.tw
  repo-url: https://github.com/ai-cooperation/cooperation.tw

  navbar:
    background: "#faf8f4"
    foreground: "#28313d"
    title: false
    logo: assets/logo.svg
    left:
      - text: "課程"
        href: courses/index.qmd
      - text: "學習地圖"
        href: method/index.qmd
      - text: "作品案例"
        href: projects/index.qmd
      - text: "企業內訓"
        href: "/#enterprise"
      - text: "關於"
        href: about.qmd
    right:
      - icon: envelope
        href: mailto:ai@cooperation.tw
      - icon: github
        href: https://github.com/ai-cooperation

  page-footer:
    center: "AI Cooperation | cooperation.tw | [Blog](/blog/) | [隱私權政策](/privacy.html) | [聯絡我們](mailto:ai@cooperation.tw)"
    background: "#0c0f14"

  open-graph:
    image: assets/og-image.png
    description: "打造人機協作的基礎架構"

format:
  html:
    theme:
      light: [cosmo, styles.css]
    toc: false
    lang: zh-TW
    include-in-header:
      text: |
        <script>document.documentElement.classList.add('js');</script>
        <!-- 卡片轉場：從卡片轉場進來的頁面，先蓋同色底再淡出（assets/card-fx.js 設 sessionStorage fx-in） -->
        <script>try{if(sessionStorage.getItem('fx-in')){sessionStorage.removeItem('fx-in');document.documentElement.classList.add('fx-in');}}catch(e){}</script>
        <style>html.fx-in::before{content:"";position:fixed;inset:0;z-index:3000;background:#faf8f4;pointer-events:none;animation:fx-in .6s ease-out .05s forwards}@keyframes fx-in{to{opacity:0;visibility:hidden}}@media (prefers-reduced-motion: reduce){html.fx-in::before{display:none}}</style>
        <link rel="stylesheet" href="/assets/card-fx.css">
        <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
        <link rel="icon" type="image/png" href="/assets/favicon.png">
        <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#faf8f4">
        <!-- Google tag (gtag.js) — cooperation.tw total -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-975S6707DM"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-975S6707DM');
        </script>
        <!-- Microsoft Clarity -->
        <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "w905wid7rj");
        </script>
    include-after-body:
      text: |
        <script>
        (function(){var els=document.querySelectorAll('.reveal-fx');if(!els.length)return;
          if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in');});return;}
          var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:.08});
          els.forEach(function(e){io.observe(e);});})();
        </script>
        <script>
        // GA4：全站 /apply CTA 點擊事件（成效漏斗上游；轉換事件 generate_lead 在表單頁送出時發）
        document.addEventListener('click', function(ev){
          var a = ev.target.closest && ev.target.closest('a[href^="/apply"]');
          if (!a || typeof gtag !== 'function') return;
          var u = new URL(a.getAttribute('href'), location.origin);
          gtag('event', 'cta_click', {
            cta_target: u.pathname,
            course_id: u.searchParams.get('course') || '',
            page_path: location.pathname,
            transport_type: 'beacon'
          });
        });
        </script>
        <script src="/assets/card-fx.js" defer></script>
        <script src="/assets/share.js" defer></script>
