project:
  type: website
  output-dir: _site
  resources:
    - assets/demos/slides/**
    - llms.txt

website:
  title: "AI Cooperation"
  description: "打造人機協作的基礎架構"
  site-url: https://cooperation.tw
  repo-url: https://github.com/ai-cooperation/cooperation.tw

  navbar:
    background: "#0c0f14"
    foreground: "#f4f6f8"
    logo: assets/logo.svg
    left:
      - text: "專案"
        href: projects/index.qmd
      - text: "課程"
        href: courses/index.qmd
      - text: "方法論"
        href: methodology/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "關於"
        href: about.qmd
    right:
      - icon: envelope
        href: mailto:ai@cooperation.tw
      - icon: github
        href: https://github.com/ai-cooperation

  page-footer:
    center: "AI Cooperation | cooperation.tw | [聯絡我們](mailto:ai@cooperation.tw)"
    background: "#0c0f14"

  open-graph:
    image: assets/og-image.png
    description: "打造人機協作的基礎架構"

