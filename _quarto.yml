project:
  type: website
  output-dir: _site
  post-render: python3 _scripts/inject_canonical.py
  resources:
    - assets/images/**
    - assets/videos/**
    - assets/icon-*.png
    - assets/icon.svg
    - assets/apple-touch-icon.png
    - assets/favicon.png
    - assets/og-image.png
    - llms.txt
    - robots.txt
    - manifest.json
    - CNAME

website:
  title: "AI Cooperation"
  description: "打造人機協作的基礎架構"
  site-url: https://cooperation.tw
  repo-url: https://github.com/ai-cooperation/cooperation.tw

  navbar:
    background: "#0c0f14"
    foreground: "#f4f6f8"
    title: false
    logo: assets/logo.svg
    left:
      - text: "專案"
        href: projects/index.qmd
      - text: "課程"
        href: courses/index.qmd
      - text: "關於"
        href: about.qmd
    right:
      - icon: envelope
        href: mailto:ai@cooperation.tw
      - icon: github
        href: https://github.com/ai-cooperation

  page-footer:
    center: "AI Cooperation | cooperation.tw | [Blog](/blog/) | [聯絡我們](mailto:ai@cooperation.tw)"
    background: "#0c0f14"

  open-graph:
    image: assets/og-image.png
    description: "打造人機協作的基礎架構"

format:
  html:
    theme:
      light: [cosmo, styles.css]
    toc: false
    lang: zh-TW
    include-in-header:
      text: |
        <script>document.documentElement.classList.add('js');</script>
        <link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
        <link rel="icon" type="image/png" href="/assets/favicon.png">
        <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#0c0f14">
        <!-- Google tag (gtag.js) — cooperation.tw total -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-975S6707DM"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-975S6707DM');
        </script>
        <!-- Microsoft Clarity -->
        <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "w905wid7rj");
        </script>
    include-after-body:
      text: |
        <script>
        (function(){var els=document.querySelectorAll('.reveal-fx');if(!els.length)return;
          if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in');});return;}
          var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:.08});
          els.forEach(function(e){io.observe(e);});})();
        </script>
